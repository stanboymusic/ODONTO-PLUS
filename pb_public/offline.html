<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Odonto Plus · Sin conexión</title>
  <meta name="theme-color" content="#0d4b52">
  <style>
    :root {
      --bg: #f9f8f5;
      --surface: #ffffff;
      --ink: #112325;
      --mut: #5e7376;
      --pri: #0d4b52;
      --pri-hover: #08363b;
      --coral: #d96555;
      --gold: #c9a45c;
      --ln: #e2e8e7;
      --r: 16px;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: var(--bg);
      color: var(--ink);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      min-height: 100dvh;
      display: grid;
      place-items: center;
      padding: 24px;
      text-align: center;
    }
    .offline-card {
      background: var(--surface);
      border: 1px solid var(--ln);
      border-radius: var(--r);
      padding: 40px 28px;
      max-width: 440px;
      width: 100%;
      box-shadow: 0 4px 20px -6px rgba(13, 75, 82, 0.08), 0 20px 40px -15px rgba(13, 75, 82, 0.12);
      animation: enter 0.3s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }
    @keyframes enter {
      from { opacity: 0; transform: scale(0.95); }
      to { opacity: 1; transform: scale(1); }
    }
    .logo-badge {
      width: 72px;
      height: 72px;
      margin: 0 auto 20px;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .logo-badge svg {
      width: 100%;
      height: 100%;
    }
    .tag {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: #fbeee8;
      color: var(--coral);
      padding: 4px 12px;
      border-radius: 99px;
      font-size: 12.5px;
      font-weight: 600;
      letter-spacing: 0.04em;
      margin-bottom: 16px;
    }
    .tag::before {
      content: '';
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--coral);
    }
    h1 {
      font-family: Georgia, "Times New Roman", serif;
      font-size: 26px;
      font-weight: 600;
      color: var(--ink);
      letter-spacing: 0.01em;
      margin-bottom: 10px;
    }
    p {
      color: var(--mut);
      font-size: 15px;
      line-height: 1.5;
      margin-bottom: 24px;
    }
    .note {
      background: var(--bg);
      border: 1px dashed var(--ln);
      border-radius: 12px;
      padding: 12px 14px;
      font-size: 13px;
      color: var(--mut);
      margin-bottom: 24px;
      text-align: left;
    }
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 100%;
      min-height: 48px;
      background: var(--pri);
      color: #fff;
      border: 0;
      border-radius: 12px;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      text-decoration: none;
      box-shadow: 0 4px 14px -3px rgba(13, 75, 82, 0.4);
      transition: background 0.15s ease-out, transform 0.15s cubic-bezier(0.16, 1, 0.3, 1);
    }
    .btn:hover { background: var(--pri-hover); }
    .btn:active { transform: scale(0.97); }
    @media (prefers-reduced-motion: reduce) {
      .offline-card { animation: none; }
      .btn:active { transform: none; }
    }
  </style>
</head>
<body>
  <div class="offline-card">
    <div class="logo-badge">
      <svg viewBox="0 0 32 32" aria-hidden="true">
        <rect width="32" height="32" rx="8" fill="#0d4b52"/>
        <path d="M16 6c-1.2 0-2 .5-4 .5-2.5 0-4 1.8-4 4.3 0 1.8.7 2.8 1 4.8.3 2.2.6 6.4 2.2 6.4 1.3 0 1.3-3.6 4.8-3.6s3.5 3.6 4.8 3.6c1.6 0 1.9-4.2 2.2-6.4.3-2 1-3 1-4.8 0-2.5-1.5-4.3-4-4.3-2 0-2.8-.5-4-.5z" fill="#fff"/>
        <path d="M16 9.5v5M13.5 12h5" stroke="#c9a45c" stroke-width="1.8" stroke-linecap="round"/>
      </svg>
    </div>
    <div class="tag">Sin conexión a internet</div>
    <h1>Odonto Plus</h1>
    <p>No se pudo establecer conexión con el servidor. Por seguridad clínica, tus datos están protegidos.</p>
    <div class="note">
      🔒 <b>Seguridad de datos clínicos:</b> los registros e historias no se almacenan desactualizados sin conexión para evitar conflictos con la base de datos de la clínica.
    </div>
    <button class="btn" id="retry">Reintentar conexión</button>
  </div>
  <script>
    const btn = document.getElementById('retry');
    btn.onclick = () => {
      btn.textContent = 'Verificando…';
      btn.disabled = true;
      setTimeout(() => window.location.reload(), 400);
    };
    window.addEventListener('online', () => {
      btn.textContent = '¡Conexión recuperada! Entrando…';
      setTimeout(() => window.location.reload(), 300);
    });
  </script>
</body>
</html>
