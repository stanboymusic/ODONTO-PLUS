app = 'odonto-plus-db'
primary_region = 'dfw'

[build]

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 1

[[mounts]]
  source = 'pb_data'
  destination = '/pb_data'

[[vm]]
  memory = '1024mb'
  cpu_kind = 'shared'
  cpus = 1
